name: Weekly Report

on:
  schedule:
    - cron: "30 6 * * 1"   # Every Monday 7:30am Lagos time
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - channel: Auto Info
            config: config.yaml
            state: state.json
            token: YT_REFRESH_TOKEN
            group: autopilot
          - channel: Undercurrent Docs
            config: config_docs.yaml
            state: state_docs.json
            token: YT_REFRESH_TOKEN_DOCS
            group: docs-autopilot
    concurrency:
      group: ${{ matrix.group }}
      cancel-in-progress: false
    env:
      CONFIG: ${{ matrix.config }}
      STATE: ${{ matrix.state }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets[matrix.token] }}
        run: python pipeline/report.py "${{ matrix.channel }}"

      - name: Save learnings
        run: |
          git config user.name "autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add ${{ matrix.state }}
          [ -d reports ] && git add reports/ || true
          git diff --cached --quiet || (git commit -m "weekly report: ${{ matrix.channel }}" && git pull --rebase && git push)

      - name: Post report as an issue (GitHub emails it to you)
        if: hashFiles('report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "${{ matrix.channel }} weekly report - $(date +%F)" --body-file report.md
