# ---- Channel settings (edit these any time on GitHub) ----
niche: >
  "Auto Info" - documentary-style explainers on how money works in Africa: how African
  billionaires, companies and industries make their money; why things cost what they cost
  (fuel, the naira, inflation, rent, food prices); and big money stories - deals, collapses,
  scams, comebacks. Focus on Nigeria first, then the rest of Africa. Written for a global
  audience (diaspora, investors, curious viewers): clear, factual, story-driven, money-focused.

# Microsoft Edge neural voice. Others: en-US-GuyNeural, en-GB-RyanNeural, en-NG-AbeoNeural
voice: en-US-AndrewNeural
voice_rate: "+4%"

# "public" once YouTube approves your API audit. Until then YouTube forces "private" anyway.
privacy: public

gemini_model: gemini-3.8-flash

# Stock-footage searches used when a scene finds nothing
fallback_footage:
  - african city skyline
  - business meeting
  - money counting
  - busy market africa
  - city traffic night
  - stock market screen
